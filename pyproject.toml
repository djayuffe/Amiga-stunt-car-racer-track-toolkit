[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="amiga-stunt-car-racer-track-toolkit"
version="1.7.1"
description="Reverse-engineering toolkit for Stunt Car Racer Amiga track resources, protected-disk evidence, editor interchange, and mesh export."
readme="README.md"
requires-python=">=3.9"
license={file="LICENSE"}
authors=[
  {name="Ulf Bertilsson"}
]
keywords=["amiga","stunt-car-racer","reverse-engineering","track-editor","mesh-export","adf","68000"]
classifiers=[
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: Utilities"
]

[project.scripts]
scrtool="scrtool.cli:main"
scrtool-advanced="scrtool.advanced_cli:main"
scrtool-edit="scrtool.edit_cli:main"
scrtool-recovery="scrtool.recovery_cli:main"
scrtool-transaction="scrtool.transaction_cli:main"
scrtool-transaction-build="scrtool.transaction_build_cli:main"

[project.optional-dependencies]
test=["pytest>=8"]

[tool.setuptools]
packages=["scrtool"]

[tool.pytest.ini_options]
testpaths=["tests"]
